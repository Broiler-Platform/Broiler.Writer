name: Release artifacts

# Deliberately dispatch-only. This produces downloadable build artifacts for
# manual prerelease testing; it does not create a GitHub release, publish a
# package, or sign anything for distribution.
#
# Signed, store-ready preview packages are produced by the monorepo's
# "Prepare Broiler Preview Package" workflow, which owns the Android signing
# material. Nothing here has access to it.
on:
  workflow_dispatch:
    inputs:
      configuration-suffix:
        description: >-
          Build the runtime-identifier-pinned configurations (Release-Windows /
          Release-Linux) rather than plain Release.
        type: boolean
        required: false
        default: true
      native-aot:
        description: >-
          Publish the desktop heads with NativeAOT — one self-contained native
          binary per platform, with no .NET runtime to install. Turn off to get
          the framework-dependent drop instead.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  desktop:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Writer.Windows/Broiler.Writer.Windows.csproj
            pinned: Release-Windows
          - os: ubuntu-latest
            rid: linux-x64
            project: src/Broiler.Writer.Linux/Broiler.Writer.Linux.csproj
            pinned: Release-Linux

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # ILCompiler shells out to a platform linker. windows-latest already carries
      # the MSVC C++ tools; on Linux the toolchain is clang plus zlib headers, and
      # installing them explicitly beats depending on what the runner image happens
      # to ship this month.
      - name: Install the NativeAOT prerequisites
        if: inputs.native-aot && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The pinned configurations are the ones src/Broiler.Writer.Windows'
      # FolderProfile.pubxml names, so the artifact is built the same way and for
      # the same runtime identifier a developer gets from Visual Studio's Publish.
      #
      # They also carry the runtime identifier NativeAOT needs. With the plain
      # Release configuration there is none, and ILCompiler falls back to the host
      # RID — correct here only because each matrix leg runs on the OS it targets.
      - name: Select the configuration
        id: configuration
        run: |
          if [ "${{ inputs.configuration-suffix }}" = "true" ]; then
            echo "value=${{ matrix.pinned }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=Release" >> "$GITHUB_OUTPUT"
          fi

      # PublishAot implies self-contained and trimmed, so the AOT artifact is a
      # single native binary that runs with no .NET runtime installed. Without it
      # the drop is framework-dependent and the tester needs .NET 10.
      - name: Publish
        run: |
          dotnet publish '${{ matrix.project }}' \
            -c '${{ steps.configuration.outputs.value }}' \
            -p:PublishAot=${{ inputs.native-aot }} \
            -o ./artifacts/${{ matrix.rid }}

      # Excluding symbols and XML docs suits both modes. An AOT publish leaves the
      # managed .pdb/.xml of every intermediate assembly next to the native binary
      # where they are dead weight — and its own native .pdb is four times the size
      # of the executable. Drop the excludes to ship symbols for crash triage.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-writer-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/**
            !artifacts/${{ matrix.rid }}/**/*.pdb
            !artifacts/${{ matrix.rid }}/**/*.xml
          if-no-files-found: error

  android:
    name: android-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Install the Android workload
        run: dotnet workload install android

      # Plain Release, not a Release-Android to match the desktop pair: the head
      # switches AndroidPackageFormat to aab on '$(Configuration)' == 'Release'
      # exactly, so any other configuration name quietly produces an APK instead.
      # AndroidPackageFormat is then overridden back to apk here because a single
      # sideloadable file is what manual prerelease testing wants; the bundle is
      # the store format and belongs to the signed monorepo workflow.
      #
      # The ABI override goes through BroilerAndroidAbis rather than
      # RuntimeIdentifiers, because the latter is an MSBuild global property and
      # would reach every referenced net10.0 library too, failing NETSDK1047.
      #
      # No signing material is configured, so the .NET Android SDK falls back to
      # the debug key. The result installs for testing and must not be
      # distributed.
      #
      # Deliberately not NativeAOT. The Android SDK raises XA1040 for it — "the
      # NativeAOT runtime on Android is an experimental feature and not yet
      # suitable for production use" — and it also collides with this head's
      # PublishTrimmed=false, since native compilation implies trimming.
      - name: Publish an APK
        run: |
          dotnet publish src/Broiler.Writer.Android/Broiler.Writer.Android.csproj \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:BroilerAndroidAbis=android-arm64 \
            -o ./artifacts/android-arm64

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-writer-android-arm64-debug-signed
          path: artifacts/android-arm64/*.apk
          if-no-files-found: error

  # The browser head has no desktop-style pinned configuration: browser-wasm is
  # selected by the SDK, and the project forces PublishTrimmed on every publish
  # path because an untrimmed publish crashes the mono runtime at boot. The
  # uploaded folder is the static site — wwwroot with the _framework payload —
  # and can be served from any static host.
  #
  # NativeAOT does not apply to browser-wasm; ILCompiler emits a native binary for
  # a desktop OS. The wasm analogue is mono's own AOT, -p:RunAOTCompilation=true,
  # which is a separate feature and is not enabled here.
  webassembly:
    name: browser-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: |
          dotnet publish src/Broiler.Writer.WebAssembly/Broiler.Writer.WebAssembly.csproj \
            -c Release \
            -o ./artifacts/browser-wasm

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-writer-browser-wasm
          path: artifacts/browser-wasm/wwwroot/**
          if-no-files-found: error
