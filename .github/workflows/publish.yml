name: Publish

# Dispatch-only. Every run publishes the Windows and Linux Writer in two variants each, and
# the Android Writer as a release-signed app bundle and APK, stamps all of them with the next
# preview version, attaches them to the run as artifacts, then drafts a GitHub pre-release
# carrying them:
#
#   Broiler.Writer-<version>-win-x64-self-contained.zip          Broiler.Writer.Windows.exe
#   Broiler.Writer-<version>-win-x64-framework-dependent.zip     Broiler.Writer.Windows.exe + its assemblies
#   Broiler.Writer-<version>-linux-x64-self-contained.zip        Broiler.Writer.Linux
#   Broiler.Writer-<version>-linux-x64-framework-dependent.zip   Broiler.Writer.Linux + its assemblies
#   Broiler.Writer-<version>.aab                                 app bundle (arm64 + x86_64)
#   Broiler.Writer-<version>-arm64.apk                           sideloadable APK
#
# The two desktop variants:
#
#   self-contained       NativeAOT, which is what makes the executable the whole application:
#                        self-contained, trimmed, no .NET runtime to install, nothing beside it.
#   framework-dependent  a plain `dotnet publish --self-contained false`: the executable plus
#                        the application's own managed assemblies, running on the .NET 10
#                        runtime installed on the machine.
#
# The Android packages are signed with the release key held in the ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets
# (the monorepo's, under the same names) by eng/sign-android-packages.ps1. The WebAssembly head
# is not published.
#
# Nothing is pushed to a feed, and every dependency restores from nuget.org as NuGet.config
# says. The draft release (eng/release-draft.sh) zips each desktop artifact and stays private
# until someone publishes it.
#
# The version is BroilerWriterVersion (Directory.Build.props) raised past every earlier
# run's writer-v* tag, and a successful run tags its commit, so preview numbers only ever
# increase and never name two builds. See eng/resolve-preview-version.mjs.
on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: >-
          Optional preview.N override (unused, and at least the next preview). Empty picks
          the next preview automatically.
        type: string
        default: ''

permissions:
  contents: read

# One run at a time, so two runs cannot pick the same preview number.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the version resolver
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  build:
    name: ${{ matrix.rid }} (${{ matrix.variant }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
        # The pinned configurations are the ones FolderProfile.pubxml names and they carry
        # the runtime identifier both variants publish for.
        os: [windows-latest, ubuntu-latest]
        variant: [self-contained, framework-dependent]
        include:
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Writer.Windows/Broiler.Writer.Windows.csproj
            configuration: Release-Windows
            executable: Broiler.Writer.Windows.exe
            assembly: Broiler.Writer.Windows
          # NativeAOT cannot cross-compile, so the Linux binary links on Linux.
          - os: ubuntu-latest
            rid: linux-x64
            project: src/Broiler.Writer.Linux/Broiler.Writer.Linux.csproj
            configuration: Release-Linux
            executable: Broiler.Writer.Linux
            assembly: Broiler.Writer.Linux

    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: artifacts/publish/${{ matrix.rid }}-${{ matrix.variant }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # ILCompiler shells out to a platform linker. windows-latest carries the MSVC C++
      # tools; on Linux the toolchain is clang plus zlib headers.
      - name: Install the NativeAOT prerequisites
        if: runner.os == 'Linux' && matrix.variant == 'self-contained'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # self-contained: PublishAot implies self-contained and trimmed - one native binary,
      # no .NET runtime to install. framework-dependent: PublishAot is switched off (the
      # Windows head sets it in its project) and the output runs on an installed runtime.
      # BroilerWriterVersion flows into Version, so the About dialog and the file version
      # match the artifact.
      - name: Publish
        run: |
          if [ '${{ matrix.variant }}' = self-contained ]; then
            mode=(-p:PublishAot=true)
          else
            mode=(--self-contained false -p:PublishAot=false)
          fi
          dotnet publish '${{ matrix.project }}' \
            -c '${{ matrix.configuration }}' \
            "${mode[@]}" \
            -p:BroilerWriterVersion="$VERSION" \
            -o "$OUT"

      # The self-contained artifact is the executable alone. Symbols (.pdb, and Linux's
      # detached .dbg) and XML docs are dead weight next to it; anything else would be a file
      # the application needs, so shipping without it would be broken - fail rather than
      # drop it.
      - name: Check that the executable is the whole application
        if: matrix.variant == 'self-contained'
        run: |
          others=$(find "$OUT" -type f ! -name '${{ matrix.executable }}' \
            ! -name '*.pdb' ! -name '*.dbg' ! -name '*.xml')
          if [ ! -f "$OUT/${{ matrix.executable }}" ] || [ -n "$others" ]; then
            echo "::error::Expected only ${{ matrix.executable }} in the publish output."
            find "$OUT" -type f
            exit 1
          fi

      # The framework-dependent artifact is the whole publish folder: the executable, the
      # application's assembly and runtimeconfig, and every managed dependency. It must not
      # carry a runtime of its own - that would make it self-contained under the wrong name.
      # Symbols and the XML docs that sit beside an assembly are dropped; everything else ships.
      - name: Check the framework-dependent output
        if: matrix.variant == 'framework-dependent'
        run: |
          for f in '${{ matrix.executable }}' '${{ matrix.assembly }}.dll' '${{ matrix.assembly }}.runtimeconfig.json'; do
            if [ ! -f "$OUT/$f" ]; then
              echo "::error::Expected $f in the publish output."
              find "$OUT" -type f
              exit 1
            fi
          done
          runtime=$(find "$OUT" -type f \( -iname 'coreclr.dll' -o -name 'libcoreclr.so' -o -iname 'hostfxr.dll' -o -name 'libhostfxr.so' \))
          if [ -n "$runtime" ]; then
            echo "::error::The framework-dependent output carries a .NET runtime: $runtime"
            exit 1
          fi
          find "$OUT" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          find "$OUT" -type f -name '*.xml' | while read -r doc; do
            if [ -f "${doc%.xml}.dll" ]; then rm "$doc"; fi
          done
          echo "$(find "$OUT" -type f | wc -l) files in the framework-dependent output."

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-writer-${{ matrix.rid }}-${{ matrix.variant }}-${{ env.VERSION }}
          path: ${{ matrix.variant == 'self-contained' && format('{0}/{1}', env.OUT, matrix.executable) || env.OUT }}
          if-no-files-found: error

  android:
    name: android (signed .aab + arm64 .apk)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # The signing certificate's fingerprint, for the release notes. A certificate is public
      # by construction - it is what a download is checked against, not key material.
      signing-certificate-sha256: ${{ steps.sign.outputs.certificate-sha256 }}

    defaults:
      run:
        shell: pwsh

    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version-code }}
      PROJECT: src/Broiler.Writer.Android/Broiler.Writer.Android.csproj
      # The compile API and the build-tools track the android workload's Microsoft.Android.Sdk
      # major, as in the monorepo's preview package workflow.
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: 36.0.0

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up the JDK the signing tools run on
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The release key lives in four repository secrets, the same ones the monorepo's
      # "Prepare Broiler Preview Package" workflow uses. Checked before the build, so a
      # missing or wrong secret fails in seconds rather than after it.
      - name: Check the Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./eng/sign-android-packages.ps1 -ValidateOnly | Out-Null

      - name: Install the Android workload
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { throw "dotnet workload install android exited with code $LASTEXITCODE." }

      # The runner ships an Android SDK, but not necessarily the API level the head compiles
      # against: install what is missing rather than a second SDK beside it.
      - name: Provision the Android SDK
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdkRoot) { throw 'Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set; this runner has no Android SDK.' }
          $platformJar = Join-Path $sdkRoot "platforms/android-$env:ANDROID_API_LEVEL/android.jar"
          $buildTools = Join-Path $sdkRoot "build-tools/$env:ANDROID_BUILD_TOOLS"
          if (-not (Test-Path $platformJar) -or -not (Test-Path $buildTools)) {
            $sdkManager = Join-Path $sdkRoot 'cmdline-tools/latest/bin/sdkmanager'
            if (-not (Test-Path $sdkManager)) { throw "The Android SDK at $sdkRoot lacks API $env:ANDROID_API_LEVEL and has no sdkmanager." }
            ("y`n" * 50) | & $sdkManager --sdk_root="$sdkRoot" --licenses | Out-Null
            & $sdkManager --sdk_root="$sdkRoot" "platforms;android-$env:ANDROID_API_LEVEL" "build-tools;$env:ANDROID_BUILD_TOOLS"
          }
          if (-not (Test-Path $platformJar)) { throw "android.jar is missing after provisioning: $platformJar" }
          "ANDROID_HOME=$sdkRoot" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV

      # Mono, not NativeAOT: the Android SDK still flags NativeAOT as experimental (XA1040).
      # Plain Release is the configuration the head switches to an app bundle under; the APK
      # overrides the format and narrows to arm64, the one ABI a phone needs. The ABI goes
      # through BroilerAndroidAbis, not RuntimeIdentifiers, which as a global property would
      # reach every net10.0 library and fail NETSDK1047. ApplicationVersion is the versionCode.
      - name: Publish the app bundle and the arm64 APK
        run: |
          $common = @('-c', 'Release', "-p:BroilerWriterVersion=$env:VERSION", "-p:ApplicationVersion=$env:VERSION_CODE")
          dotnet publish $env:PROJECT @common -o artifacts/android/aab
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the app bundle failed.' }
          dotnet publish $env:PROJECT @common -p:AndroidPackageFormat=apk -p:BroilerAndroidAbis=android-arm64 -o artifacts/android/apk
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the APK failed.' }

      # Each publish leaves the unsigned org.broiler.writer.<ext> beside a -Signed copy carrying
      # the workload's debug key. The unsigned one is carried forward and signed with the
      # release key; checking it here means neither format can ship under the other's name and
      # a debug-signed package cannot arrive looking release-ready.
      - name: Collect and verify the packages
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-Entries($Path) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $Path))
            try { @($zip.Entries | ForEach-Object FullName) } finally { $zip.Dispose() }
          }
          function Get-Abis($Entries) {
            @($Entries | ForEach-Object { if ($_ -match '^(?:base/)?lib/([^/]+)/.') { $Matches[1] } } | Sort-Object -Unique)
          }
          function Assert-Unsigned($Path, $Entries) {
            $signature = @($Entries | Where-Object { $_ -match '^META-INF/.+\.(RSA|DSA|EC|SF)$' })
            if ($signature) { throw "$Path is already signed; the debug-signed package was picked up." }
          }

          $out = 'artifacts/android/signed'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundle = 'artifacts/android/aab/org.broiler.writer.aab'
          $apk = 'artifacts/android/apk/org.broiler.writer.apk'
          foreach ($p in $bundle, $apk) {
            if (-not (Test-Path $p)) { throw "Expected $p; the publish produced: $(Get-ChildItem (Split-Path $p) -Name)" }
          }

          $entries = Get-Entries $bundle
          if ($entries -notcontains 'BundleConfig.pb') { throw "$bundle is not an app bundle: BundleConfig.pb is missing." }
          Assert-Unsigned $bundle $entries
          Write-Host "==> ${bundle}: app bundle, ABIs $((Get-Abis $entries) -join ', ')"

          $entries = Get-Entries $apk
          if ($entries -notcontains 'AndroidManifest.xml' -or $entries -contains 'BundleConfig.pb') { throw "$apk is not an APK." }
          $abis = @(Get-Abis $entries)
          if ($abis.Count -ne 1 -or $abis[0] -ne 'arm64-v8a') { throw "$apk should carry arm64-v8a only; found: $($abis -join ', ')" }
          Assert-Unsigned $apk $entries
          Write-Host "==> ${apk}: apk, arm64-v8a"

          Copy-Item $bundle "$out/Broiler.Writer-$env:VERSION.aab"
          Copy-Item $apk "$out/Broiler.Writer-$env:VERSION-arm64.apk"

      # The .aab is signed with jarsigner, the .apk zipaligned and signed with apksigner; the
      # script verifies both against the release certificate and returns its fingerprint.
      - name: Sign the packages
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $out = 'artifacts/android/signed'
          $fingerprint = ./eng/sign-android-packages.ps1 `
            -BundlePath "$out/Broiler.Writer-$env:VERSION.aab" `
            -ApkPath "$out/Broiler.Writer-$env:VERSION-arm64.apk"
          if ([string]::IsNullOrWhiteSpace($fingerprint)) { throw 'The signing script returned no certificate fingerprint.' }
          "certificate-sha256=$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-writer-android-${{ env.VERSION }}
          path: artifacts/android/signed/*
          if-no-files-found: error

  release:
    name: Tag and draft release ${{ needs.version.outputs.tag }}
    needs: [version, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Only after every platform and variant built: a failed run leaves its number free. The
      # tag is pushed here rather than left to the release, because a draft release does not
      # create its tag until it is published - and the next run counts tags.
      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: broiler-writer-*
          path: artifacts

      # A draft pre-release: nothing is public until someone reviews and publishes it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_SIGNING_CERT_SHA256: ${{ needs.android.outputs.signing-certificate-sha256 }}
        run: bash eng/release-draft.sh "$VERSION" artifacts

      - name: Summary
        run: |
          {
            echo "### Broiler.Writer $VERSION"
            echo
            echo "Commit tagged \`$TAG\`. A draft pre-release **Broiler Writer $VERSION** was created with:"
            echo
            for rid in win-x64 linux-x64; do
              for variant in self-contained framework-dependent; do
                echo "- \`Broiler.Writer-$VERSION-$rid-$variant.zip\`"
              done
            done
            echo "- \`Broiler.Writer-$VERSION.aab\` and \`Broiler.Writer-$VERSION-arm64.apk\`"
            echo
            echo "Review it under Releases and publish it there."
          } >> "$GITHUB_STEP_SUMMARY"
