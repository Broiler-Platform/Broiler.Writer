name: Set up Broiler.Writer
description: >-
  Installs the .NET SDK and configures NuGet authentication for the
  Broiler-Platform GitHub Packages feed.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'
  token:
    description: GitHub token or PAT to authenticate against the GitHub Packages feed.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        source-url: https://nuget.pkg.github.com/Broiler-Platform/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ inputs.token }}
