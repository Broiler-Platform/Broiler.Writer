name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows head targets net10.0-windows and renders through Direct2D,
          # so it only builds on Windows.
          - name: Windows head
            os: windows-latest
            solution: Broiler.Windows.Writer.slnx
            test: false
          # NOTE: The Linux head and test suite are disabled until their project
          # files and source code are migrated from submodules to NuGet packages.
          # - name: Linux head
          #   os: ubuntu-latest
          #   solution: Broiler.Linux.Writer.slnx
          #   test: false
          # - name: Tests (Linux)
          #   os: ubuntu-latest
          #   solution: Broiler.Writer.Tests.slnx
          #   test: true
          # - name: Tests (Windows)
          #   os: windows-latest
          #   solution: Broiler.Writer.Tests.slnx
          #   test: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c Release

      - name: Test
        if: matrix.test
        run: dotnet test ${{ matrix.solution }} -c Release --no-build

  # Disabled until Android head is migrated from submodules to NuGet packages:
  # android:
  #   name: Android head
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 60
  #
  #   steps:
  #     - name: Check out
  #       uses: actions/checkout@v7
  #
  #     - name: Set up
  #       uses: ./.github/actions/setup-broiler
  #
  #     # net10.0-android needs the workload for the Mono runtime packs; without it
  #     # the restore fails outright rather than degrading.
  #     - name: Install the Android workload
  #       run: dotnet workload install android
  #
  #     - name: Build
  #       run: dotnet build Broiler.Android.Writer.slnx -c Release

  # Disabled until WebAssembly head is migrated from submodules to NuGet packages:
  # webassembly:
  #   name: WebAssembly head
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 60
  #
  #   steps:
  #     - name: Check out
  #       uses: actions/checkout@v7
  #
  #     - name: Set up
  #       uses: ./.github/actions/setup-broiler
  #
  #     - name: Install the wasm-tools workload
  #       run: dotnet workload install wasm-tools
  #
  #     - name: Build
  #       run: dotnet build Broiler.WebAssembly.Writer.slnx -c Release
  #
  #     - name: Publish
  #       run: dotnet publish src/Broiler.Writer.WebAssembly/Broiler.Writer.WebAssembly.csproj -c Release

  # The desktop heads publish through configurations the solutions do not declare
  # (Release-Windows / Release-Linux pin win-x64 and linux-x64). Those have to be
  # project-level builds — a solution-level build with an undeclared configuration
  # fails MSB4126 — so they are exercised here rather than in `build`.
  #
  # This job publishes with NativeAOT because that is what release.yml ships. AOT
  # is the one build mode that fails on reflection the rest of the build accepts,
  # so leaving it to release time would mean discovering a regression only when
  # cutting a release. It costs this job a few minutes; that is the trade.
  publish:
    name: Publish ${{ matrix.rid }} (NativeAOT)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Writer.Windows/Broiler.Writer.Windows.csproj
            configuration: Release-Windows
          # - os: ubuntu-latest
          #   rid: linux-x64
          #   project: src/Broiler.Writer.Linux/Broiler.Writer.Linux.csproj
          #   configuration: Release-Linux

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # ILCompiler shells out to a platform linker. windows-latest already carries
      # the MSVC C++ tools; on Linux the toolchain is clang plus zlib headers.
      - name: Install the NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: dotnet publish ${{ matrix.project }} -c ${{ matrix.configuration }} -p:PublishAot=true

