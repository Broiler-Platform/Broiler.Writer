name: Set up Broiler.Writer
description: >-
  Installs the .NET SDK. Every package restores from nuget.org as NuGet.config says, so no
  feed or credentials are configured here.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
