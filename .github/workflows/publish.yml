name: Publish

# Dispatch-only. Every run builds all three platforms with NativeAOT, stamps them with the
# next preview version and packs each into its own NuGet package, attached to the run as
# an artifact. Nothing is pushed to a feed.
#
#   Broiler.Writer.win-x64        tools/win-x64/Broiler.Writer.Windows.exe
#   Broiler.Writer.linux-x64      tools/linux-x64/Broiler.Writer.Linux
#   Broiler.Writer.android-arm64  tools/android-arm64/org.broiler.writer-Signed.apk
#
# nuget-source picks the feed the Broiler.* dependencies are restored from. NuGet.config
# resolves everything from nuget.org; broiler-github maps Broiler.* to the Broiler-Platform
# GitHub Packages feed instead, for components published there but not yet to nuget.org.
#
# The version is BroilerWriterVersion (Directory.Build.props) raised past every earlier
# run's writer-v* tag, and a successful run tags its commit, so preview numbers only ever
# increase and never name two builds. See eng/resolve-preview-version.mjs.
#
# The APK is signed with the .NET Android debug key: no signing material is configured
# here. It sideloads for testing but is not store-ready; the signed store package still
# comes from the monorepo's "Prepare Broiler Preview Package" workflow.
on:
  workflow_dispatch:
    inputs:
      nuget-source:
        description: Feed to restore the Broiler.* dependency packages from
        type: choice
        options: [nuget.org, broiler-github]
        default: nuget.org
      version-suffix:
        description: >-
          Optional preview.N override (unused, and at least the next preview). Empty picks
          the next preview automatically.
        type: string
        default: ''

permissions:
  contents: read
  packages: read

# One run at a time, so two runs cannot pick the same preview number.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the version resolver
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  build:
    name: ${{ matrix.rid }} (NativeAOT)
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
        include:
          # The pinned configurations are the ones FolderProfile.pubxml names and they
          # carry the runtime identifier NativeAOT needs.
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Writer.Windows/Broiler.Writer.Windows.csproj
            configuration: Release-Windows
          # NativeAOT cannot cross-compile, so the Linux binary links on Linux.
          - os: ubuntu-latest
            rid: linux-x64
            project: src/Broiler.Writer.Linux/Broiler.Writer.Linux.csproj
            configuration: Release-Linux
          # Plain Release: the head only honours BroilerAndroidAbis and
          # AndroidPackageFormat under that exact name. See the Android step below.
          - os: ubuntu-latest
            rid: android-arm64
            project: src/Broiler.Writer.Android/Broiler.Writer.Android.csproj
            configuration: Release

    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version-code }}
      # Read by NuGet for the github-broiler source in NuGet.config. Unused, and harmless,
      # when Broiler.* restores from nuget.org.
      NuGetPackageSourceCredentials_github-broiler: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # NuGet.config declares github-broiler but maps every package to nuget.org. A more
      # specific Broiler.* pattern wins, so adding one moves exactly the Broiler packages.
      - name: Restore Broiler.* from ${{ inputs.nuget-source }}
        if: inputs.nuget-source == 'broiler-github'
        run: |
          sed -i '/<\/packageSourceMapping>/i\    <packageSource key="github-broiler"><package pattern="Broiler.*" /></packageSource>' NuGet.config
          grep -q 'key="github-broiler"><package pattern="Broiler' NuGet.config

      # ILCompiler shells out to a platform linker. windows-latest carries the MSVC C++
      # tools; on Linux the toolchain is clang plus zlib headers. Android links with the
      # NDK the ubuntu image already ships.
      - name: Install the NativeAOT prerequisites
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Install the Android workload
        if: matrix.rid == 'android-arm64'
        run: dotnet workload install android

      # PublishAot implies self-contained and trimmed: one native binary, no .NET runtime
      # to install. BroilerWriterVersion flows into Version, so the About dialog and the
      # file version match the package version.
      - name: Publish (desktop)
        if: matrix.rid != 'android-arm64'
        run: |
          dotnet publish '${{ matrix.project }}' \
            -c '${{ matrix.configuration }}' \
            -p:PublishAot=true \
            -p:BroilerWriterVersion="$VERSION" \
            -o "./artifacts/publish/${{ matrix.rid }}"
          mkdir -p "./artifacts/stage/${{ matrix.rid }}"
          cp -R "./artifacts/publish/${{ matrix.rid }}/." "./artifacts/stage/${{ matrix.rid }}/"

      # NativeAOT on Android is flagged experimental by the SDK (XA1040); the head is
      # nevertheless trim- and AOT-clean. PublishTrimmed is forced on because native
      # compilation implies trimming and the head defaults it off for its Mono build.
      #
      # AndroidPackageFormat=apk gives a single sideloadable file instead of the store
      # bundle. The ABI goes through BroilerAndroidAbis rather than RuntimeIdentifiers,
      # which as a global property would reach every net10.0 library and fail NETSDK1047.
      # ApplicationVersion is Android's versionCode and must only ever increase; the
      # preview number does.
      - name: Publish (Android)
        if: matrix.rid == 'android-arm64'
        run: |
          dotnet publish '${{ matrix.project }}' \
            -c '${{ matrix.configuration }}' \
            -p:PublishAot=true \
            -p:PublishTrimmed=true \
            -p:AndroidNdkDirectory="$ANDROID_NDK_LATEST_HOME" \
            -p:AndroidPackageFormat=apk \
            -p:BroilerAndroidAbis=android-arm64 \
            -p:BroilerWriterVersion="$VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -o "./artifacts/publish/${{ matrix.rid }}"
          mkdir -p "./artifacts/stage/${{ matrix.rid }}"
          cp ./artifacts/publish/${{ matrix.rid }}/*-Signed.apk "./artifacts/stage/${{ matrix.rid }}/"

      - name: Pack
        run: |
          dotnet pack eng/package/Broiler.Writer.Package.csproj \
            -c Release \
            -p:BroilerPackageRid='${{ matrix.rid }}' \
            -p:BroilerPackageInput="$GITHUB_WORKSPACE/artifacts/stage/${{ matrix.rid }}" \
            -p:BroilerWriterVersion="$VERSION" \
            -o ./artifacts/nupkg

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-writer-${{ matrix.rid }}-${{ env.VERSION }}
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

  tag:
    name: Tag ${{ needs.version.outputs.tag }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Only after all three platforms built: a failed run leaves its number free.
      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: broiler-writer-*
          merge-multiple: true
          path: artifacts

      - name: Summary
        run: |
          {
            echo "### Broiler.Writer $VERSION"
            echo
            echo "Dependencies restored from \`${{ inputs.nuget-source }}\`; commit tagged \`$TAG\`."
            echo 'The packages are attached to this run as artifacts.'
            echo
            echo '```'
            ls -1 artifacts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
